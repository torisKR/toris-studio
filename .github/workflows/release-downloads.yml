name: Publish desktop download page

on:
  push:
    branches: [main]
    paths: ['docs/download/**', '.github/workflows/release-downloads.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-download-page
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'torisKR/toris-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/download
      - name: Deploy public download page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
