name: Desktop checks and installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'skills/toris-video-motion/**', 'db/**', 'package.json', 'pnpm-lock.yaml', 'scripts/release*', 'scripts/release-verify/**', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml', '.github/workflows/release-downloads.yml', 'compose.yaml']
  pull_request:
    paths: ['desktop/**', 'skills/toris-video-motion/**', 'db/**', 'package.json', 'pnpm-lock.yaml', 'scripts/release*', 'scripts/release-verify/**', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml', '.github/workflows/release-downloads.yml', 'compose.yaml']

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan committed history for exposed credentials
        run: bash scripts/release-security.sh
  native:
    needs: security
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-arm64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macOS-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install locked packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust, desktop UI, and release tooling
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          pnpm desktop:check
          node --test scripts/release-assets.test.mjs
          cargo test --locked --manifest-path scripts/release-verify/Cargo.toml
      - name: Build unsigned preview installer (no release secrets)
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          node scripts/release-assets.mjs preview-config "$RUNNER_TEMP/tauri-preview.json"
          pnpm desktop:build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config "$RUNNER_TEMP/tauri-preview.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: preview-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
