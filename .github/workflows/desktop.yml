name: Desktop checks and installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'skills/toris-video-motion/**', 'db/**', 'infrastructure/oauth-callback/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/release*', 'scripts/release-verify/**', 'scripts/prepare-runtime*', 'scripts/build-agent-runtime.mjs', 'infrastructure/agent-vector-db/**', 'scripts/prepare-browser*', 'scripts/publication-release-contract.test.mjs', 'scripts/verify-publication-*.mjs', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml', '.github/workflows/release-downloads.yml', '.github/workflows/publication-checks.yml', 'compose.yaml']
  pull_request:
    paths: ['desktop/**', 'skills/toris-video-motion/**', 'db/**', 'infrastructure/oauth-callback/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/release*', 'scripts/release-verify/**', 'scripts/prepare-runtime*', 'scripts/build-agent-runtime.mjs', 'infrastructure/agent-vector-db/**', 'scripts/prepare-browser*', 'scripts/publication-release-contract.test.mjs', 'scripts/verify-publication-*.mjs', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml', '.github/workflows/release-downloads.yml', '.github/workflows/publication-checks.yml', 'compose.yaml']

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan committed history for exposed credentials
        run: bash scripts/release-security.sh
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check dependency advisories
        run: pnpm audit --audit-level=low
      - name: Check repository harness (feature map, mutant targets)
        run: |
          node scripts/harness-check.mjs --all
          node --test scripts/harness-check.test.mjs
      - name: Check local API, AI handoff and OAuth callback contracts
        run: |
          pnpm test
          node --test scripts/publication-release-contract.test.mjs
          node --import tsx --test infrastructure/oauth-callback/callback.test.mjs
      - name: Check pinned runtime packaging contracts without downloads
        run: node --test scripts/prepare-runtime.test.mjs scripts/prepare-browser.test.mjs desktop/browser-runtime/policy.test.mjs desktop/browser-runtime/worker.test.mjs
      - name: Check agent runtime (LangGraph graph, tool sandbox, RAG chunking)
        run: |
          pnpm agent:typecheck
          pnpm agent:test
          pnpm agent:build
  publication-safety:
    needs: [security, contracts]
    uses: ./.github/workflows/publication-checks.yml
    permissions:
      contents: read

  native:
    needs: [security, contracts, publication-safety]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS-arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macOS-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.os == 'macOS'
        with:
          go-version: '1.26.9'
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Install locked packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check Rust, desktop UI, and release tooling
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          pnpm desktop:check
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --test ipc_acl_contract
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib native_windows::
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --lib updater::
          node --test scripts/release-assets.test.mjs
          cargo test --locked --manifest-path scripts/release-verify/Cargo.toml
      - name: Build unsigned preview installer (no release secrets)
        id: preview-build
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          pnpm desktop:preview --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Verify re-extracted installer runtimes and headed browser
        run: node scripts/prepare-browser-installer.mjs '${{ matrix.target }}' 'desktop/src-tauri/target/${{ matrix.target }}/release/bundle'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() && steps.preview-build.outcome == 'success' }}
        with:
          name: preview-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
