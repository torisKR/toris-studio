name: Deploy OAuth broker

# Deploys infrastructure/oauth-broker to oauth.toris.kr. Manual only, from main only.
# Provider secrets (GOOGLE_CLIENT_SECRET, TIKTOK_CLIENT_SECRET, ...) are not handled here: they are put into
# Cloudflare directly with `wrangler secret put`, and `wrangler deploy` keeps the secrets already set.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-broker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_VERSION: '4.158.0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=''
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::GitHub 저장소 시크릿이 없습니다:$missing. Settings → Secrets and variables → Actions에 넣은 뒤 다시 실행하세요."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked packages
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check the OAuth broker and callback before deploying
        run: node --import tsx --test infrastructure/oauth-broker/broker.test.mjs infrastructure/oauth-callback/callback.test.mjs
      - name: Install the pinned wrangler outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
          printf '%s/wrangler/node_modules/.bin\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: wrangler deploy
        working-directory: infrastructure/oauth-broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler --version
          wrangler deploy
      - name: wrangler triggers deploy
        working-directory: infrastructure/oauth-broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler triggers deploy
      - name: Show which platforms the deployed broker serves
        run: |
          version="$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")"
          # Only the public config is printed: the minimum app version and the enabled flags.
          curl -fsS --retry 3 --retry-delay 5 -A "TorisStudio/$version" https://oauth.toris.kr/v1/config \
            | jq -r '"minAppVersion: \(.minAppVersion)", (.platforms | to_entries[] | "\(.key): enabled=\(.value.enabled)"), "naverSearch: enabled=\(.naverSearch.enabled)"'
