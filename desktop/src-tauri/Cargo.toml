[package]
name = "toris-studio-desktop"
version = "0.1.11"
edition = "2021"
rust-version = "1.90"
default-run = "toris-studio-desktop"

[lib]
name = "toris_studio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-updater", "dep:updater-http"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-updater = { version = "~2.13.2", optional = true }
updater-http = { package = "reqwest", version = "0.13", default-features = false, optional = true }
minisign-verify = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
quick-xml = { version = "0.41", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
futures-util = "0.3"
dotenvy = "0.15"
dirs = "6"
tempfile = "3"
fontdue = "0.9"
png = "0.17"
rand = "0.8"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[profile.release]
# rust-lang/rust#157750: stripping proc-macro dylibs breaks macOS 27 loading.
strip = "none"
lto = "thin"
codegen-units = 1
