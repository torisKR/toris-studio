name: toris-studio-local
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TORIS_DB_PORT:-54329}:5432"
    environment:
      POSTGRES_USER: toris_owner
      POSTGRES_DB: toris_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use .env.db.local generated by npm run db:start}
      TORIS_DB_APP_PASSWORD: ${TORIS_DB_APP_PASSWORD:?Use .env.db.local generated by npm run db:start}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init/00-app-role.sh:/docker-entrypoint-initdb.d/00-app-role.sh:ro
      - ./db/migrations/001_social.sql:/docker-entrypoint-initdb.d/01-social.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toris_owner -d toris_studio"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
